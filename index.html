<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f6f8fc" />
  <title>Moje garáž</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar"><div><div class="eyebrow">GARÁŽ</div><h1>Moje garáž</h1><p>Všechna tvoje vozidla na jednom místě</p></div><button class="icon-btn" aria-label="Notifikace" id="notifBtn">🔔<span class="badge">2</span></button></header>
    <main id="main"></main>
    <nav class="bottom-nav"><button class="nav-item active" data-view="garage"><span>🚙</span><b>Garáž</b></button><button class="nav-item" data-view="terms"><span>📅</span><b>Termíny</b></button><button class="nav-item" data-view="docs"><span>📄</span><b>Dokumenty</b></button><button class="nav-item" data-view="more"><span>•••</span><b>Více</b></button></nav>
  </div>
  <dialog id="vehicleDialog" class="modal"><form method="dialog" id="vehicleForm" class="modal-card"><div class="modal-head"><div><div class="eyebrow">NOVÉ VOZIDLO</div><h2>Přidat vozidlo</h2></div><button class="close-btn" value="cancel" aria-label="Zavřít">✕</button></div><label>Název vozidla<input name="name" required placeholder="např. Ford Mustang Mach‑E"></label><div class="grid2"><label>SPZ<input name="plate" required placeholder="7AC 1234"></label><label>Typ<select name="type"><option>Osobní automobil</option><option>Přívěsný vozík</option><option>Motocykl</option><option>Dodávka</option><option>Jiné</option></select></label></div><div class="grid2"><label>Rok<input name="year" inputmode="numeric" placeholder="2024"></label><label>Aktuální km<input name="km" inputmode="numeric" placeholder="60000"></label></div><label>VIN<input name="vin" placeholder="Volitelné"></label><button class="primary wide" value="default">Přidat do garáže</button></form></dialog>
  <dialog id="docDialog" class="modal"><form method="dialog" id="docForm" class="modal-card"><div class="modal-head"><div><div class="eyebrow">ZDARMA</div><h2>Zelená karta</h2></div><button class="close-btn" value="cancel">✕</button></div><input type="hidden" name="vehicleId" /><label>Platnost do<input type="date" name="validTo"></label><label class="upload-zone">📷<strong>Vyfotit / vybrat zelenou kartu</strong><span>Soubor zůstane v tomto zařízení</span><input type="file" name="file" accept="image/*,application/pdf"></label><div id="docFileName" class="file-name"></div><button class="primary wide" value="default">Uložit dokument</button></form></dialog>
  <dialog id="premiumDialog" class="modal"><form method="dialog" class="modal-card premium-modal"><div class="modal-head"><div><div class="eyebrow gold">PREMIUM</div><h2>Už na nic nezapomeň</h2></div><button class="close-btn" value="cancel">✕</button></div><p class="lead">STK, olej, pneumatiky, servisní termíny a upozornění na jednom místě.</p><div class="price"><strong>599 Kč</strong><span>/ rok</span></div><button class="premium-cta" value="cancel">Vyzkoušet Premium</button><small>Platby jsou v tomto prototypu zatím jen ukázkové.</small></form></dialog>
  <script src="app.js"></script><script src="odometer.js"></script><script src="appearance.js"></script><script src="vehicle-edit.js"></script><script src="term-links.js"></script><script src="powertrain-service.js"></script><script src="service-contact.js"></script><script src="reminder-label.js"></script><script src="cloud-sync.js"></script>
</body>
</html>
